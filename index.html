<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Seduction - Horror</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }

        /* ЭКРАН СТАРТА */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff0033;
            z-index: 100;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            text-shadow: 0 0 20px #ff0033, 0 0 40px #ff0033;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        p {
            color: #ccc;
            font-size: 18px;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: transparent;
            border: 2px solid #ff0033;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
        }

        .btn:hover {
            background: #ff0033;
            box-shadow: 0 0 30px #ff0033;
        }

        /* UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0033;
            pointer-events: none;
        }

        /* КРОВАВЫЙ ОВЕРЛЕЙ (ПРИ ПРИБЛИЖЕНИИ МОНСТРА) */
        #blood-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            box-shadow: inset 0 0 100px 50px rgba(255, 0, 0, 0); /* Изначально прозрачный */
            transition: box-shadow 0.3s;
            z-index: 50;
        }

        /* СКРИМЕР */
        #jumpscare {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #jumpscare-face {
            font-size: 60vh;
            color: red;
            text-shadow: 0 0 50px red;
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(10px, 10px) scale(1.1); }
            25% { transform: translate(-10px, -10px) scale(1.2); }
            50% { transform: translate(-10px, 10px) scale(1.1); }
            75% { transform: translate(10px, -10px) scale(1.3); }
            100% { transform: translate(10px, 10px) scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- Фоновая музыка (генерируется кодом) -->

    <div id="ui">Артефакты: <span id="score">0</span> / 3</div>
    
    <div id="blood-overlay"></div>

    <div id="start-screen">
        <h1>Midnight Seduction</h1>
        <p>Найди 3 кровавых артефакта, чтобы сбежать.<br>Она уже ищет тебя... Не дай ей приблизиться.<br><br>Управление: <b>WASD</b> или <b>Стрелки</b> для движения.<br>Мышь — твой фонарик.</p>
        <button class="btn" onclick="startGame()">Войти в тьму</button>
    </div>

    <div id="jumpscare">
        <div id="jumpscare-face">💋🩸</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ЗВУКОВОЙ ДВИЖОК ---
        let audioCtx;
        let heartbeatInterval;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'step') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'pickup') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'heartbeat') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(60, now);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'scream') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 1);
                gain.gain.setValueAtTime(1, now); gain.gain.linearRampToValueAtTime(0, now + 1);
                osc.start(now); osc.stop(now + 1);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        let isPlaying = false;
        let mouseX = width / 2;
        let mouseY = height / 2;
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

        let player = { x: 0, y: 0, radius: 15, speed: 3 };
        let monster = { x: 0, y: 0, radius: 20, speed: 1.5 };
        let items = [];
        let score = 0;
        let walls = []; // Препятствия
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        function startGame() {
            initAudio();
            document.getElementById('start-screen').style.display = 'none';
            isPlaying = true;
            
            // Сброс
            player.x = width / 2;
            player.y = height / 2;
            score = 0;
            document.getElementById('score').textContent = score;
            
            // Спавн монстра далеко от игрока
            monster.x = Math.random() > 0.5 ? 100 : width - 100;
            monster.y = Math.random() > 0.5 ? 100 : height - 100;

            // Спавн артефактов
            items = [];
            for (let i = 0; i < 3; i++) {
                items.push({
                    x: Math.random() * (width - 100) + 50,
                    y: Math.random() * (height - 100) + 50,
                    radius: 10,
                    collected: false
                });
            }

            // Создаем кровавые стены (случайные)
            walls = [];
            for (let i = 0; i < 15; i++) {
                walls.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    w: Math.random() * 100 + 50,
                    h: Math.random() * 20 + 20,
                    color: '#300' // Темно-кровавый
                });
            }

            // Запуск сердцебиения
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if(!isPlaying) return;
                // Чем ближе монстр, тем быстрее стук
                const dist = Math.hypot(player.x - monster.x, player.y - monster.y);
                if (dist < 400) playSound('heartbeat');
            }, 1000);

            gameLoop();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(heartbeatInterval);
            playSound('scream');
            
            document.getElementById('jumpscare').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('jumpscare').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
                document.querySelector('#start-screen h1').textContent = "Она забрала тебя...";
                document.querySelector('.btn').textContent = "Попробовать снова";
            }, 2000);
        }

        function update() {
            if (!isPlaying) return;

            // Движение игрока
            let dx = 0, dy = 0;
            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;

            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                player.x += (dx / len) * player.speed;
                player.y += (dy / len) * player.speed;
                // Звук шагов
                if (Math.random() < 0.1) playSound('step');
            }

            // Ограничение по экрану
            player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

            // Движение монстра (преследование)
            const angle = Math.atan2(player.y - monster.y, player.x - monster.x);
            monster.x += Math.cos(angle) * monster.speed;
            monster.y += Math.sin(angle) * monster.speed;

            // Проверка на проигрыш
            if (Math.hypot(player.x - monster.x, player.y - monster.y) < player.radius + monster.radius) {
                endGame();
            }

            // Проверка на сбор артефактов
            items.forEach((item, index) => {
                if (!item.collected) {
                    if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.radius) {
                        item.collected = true;
                        score++;
                        document.getElementById('score').textContent = score;
                        playSound('pickup');
                        if (score >= 3) {
                            // Победа
                            isPlaying = false;
                            clearInterval(heartbeatInterval);
                            document.getElementById('start-screen').style.display = 'flex';
                            document.querySelector('#start-screen h1').textContent = "Ты сбежал!";
                            document.querySelector('#start-screen p').textContent = "Но она все еще где-то рядом...";
                            document.querySelector('.btn').textContent = "Играть снова";
                        }
                    }
                }
            });

            // Красный оверлей (чем ближе, тем страшнее)
            const distToMonster = Math.hypot(player.x - monster.x, player.y - monster.y);
            if (distToMonster < 300) {
                const intensity = (300 - distToMonster) / 300; // от 0 до 1
                document.getElementById('blood-overlay').style.boxShadow = `inset 0 0 150px ${intensity * 80}px rgba(255, 0, 0, ${intensity * 0.8})`;
                // Ускоряем монстра при приближении (паника)
                monster.speed = 1.5 + intensity;
            } else {
                document.getElementById('blood-overlay').style.boxShadow = `inset 0 0 100px 50px rgba(255, 0, 0, 0)`;
                monster.speed = 1.5;
            }
        }

        function draw() {
            if (!isPlaying && !document.getElementById('jumpscare').style.display === 'flex') return;

            // Очистка (полная темнота)
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Отрисовка стен
            ctx.fillStyle = '#1a0000';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
            });

            // Отрисовка артефактов
            items.forEach(item => {
                if (!item.collected) {
                    ctx.fillStyle = '#ff0033';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff0033';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Отрисовка монстра (Суккуб)
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0000';
            ctx.font = '40px Arial';
            ctx.fillText('💋', monster.x - 20, monster.y + 15);
            ctx.shadowBlur = 0;

            // Отрисовка игрока
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // МАСКА ТЕМНОТЫ И ФОНАРИК
            // Создаем черный слой поверх всего
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.fillRect(0, 0, width, height);

            // Вырезаем круг света от игрока (базовое зрение)
            ctx.globalCompositeOperation = 'destination-out';
            
            // Фонарик следует за мышкой
            const flashAngle = Math.atan2(mouseY - player.y, mouseX - player.x);
            
            // Круг вокруг игрока
            let gradient = ctx.createRadialGradient(player.x, player.y, 20, player.x, player.y, 150);
            gradient.addColorStop(0, 'rgba(0,0,0,1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(player.x, player.y, 150, 0, Math.PI * 2);
            ctx.fill();

            // Конус фонарика
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.arc(player.x, player.y, 400, flashAngle - 0.4, flashAngle + 0.4);
            ctx.closePath();
            
            gradient = ctx.createRadialGradient(player.x, player.y, 50, player.x, player.y, 400);
            gradient.addColorStop(0, 'rgba(0,0,0,1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';

            // Отрисовка прицела
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 5, 0, Math.PI * 2);
            ctx.stroke();
        }

        function gameLoop() {
            update();
            draw();
            if (isPlaying) {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
